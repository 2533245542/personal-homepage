short_bio: >-
  <p>
    周伟鹏现任南方科技大学公共卫生及应急管理学院助理教授。他的研究聚焦医学人工智能与医学自然语言处理，致力于从电子健康记录、生物医学文献和公共卫生文本等非结构化数据中提取可靠、可解释、可复用的知识。主要研究方向包括临床文本理解、大语言模型在医疗与公共卫生场景中的适配与评估、电子健康记录表型识别，以及疾病与伤害监测预警。
  </p>
  <p>
    Weipeng Zhou is an Assistant Professor in the School of Public Health and Emergency Management at the Southern University of Science and Technology. His research focuses on medical artificial intelligence and medical natural language processing, with an emphasis on extracting reliable, interpretable, and reusable knowledge from unstructured electronic health records, biomedical literature, and public health text. His current interests include clinical text understanding, adaptation and evaluation of large language models for health applications, electronic health record phenotyping, and disease and injury surveillance.
  </p>

